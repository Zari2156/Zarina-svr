<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аналитика рекламы — Facebook × amoCRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__title">
    <span class="topbar__mark"></span>
    <div>
      <h1>Ads Control</h1>
      <p>Facebook Ads + amoCRM в одной картине</p>
    </div>
  </div>
  <div class="topbar__actions">
    <div class="date-range">
      <input type="date" id="dateFrom" class="date-input">
      <span class="date-sep">—</span>
      <input type="date" id="dateTo" class="date-input">
      <button id="applyDateBtn" class="btn btn--ghost">Показать</button>
    </div>
    <span id="lastSync" class="last-sync">Данных пока нет</span>
    <button id="syncBtn" class="btn btn--primary">Обновить данные</button>
  </div>
</header>

<main class="layout">

  <section class="totals" id="totals">
    <!-- карточки тотала рендерятся из app.js -->
  </section>

  <section class="content">
    <div class="panel panel--table">
      <div class="panel__head">
        <h2>Объявления</h2>
        <div class="sort-controls">
          <label for="sortSelect">Сортировать по</label>
          <select id="sortSelect">
            <option value="roas">ROAS</option>
            <option value="cpl">CPL</option>
            <option value="spend">Расходу</option>
            <option value="revenue">Выручке</option>
            <option value="leads">Лидам</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table id="adsTable">
          <thead>
            <tr>
              <th>Объявление</th>
              <th>Кампания</th>
              <th>Расход</th>
              <th>Лиды</th>
              <th>CPL</th>
              <th>Продажи</th>
              <th>Выручка</th>
              <th>ROAS</th>
            </tr>
          </thead>
          <tbody id="adsTableBody"></tbody>
        </table>
      </div>
    </div>

    <aside class="panel panel--assistant">
      <div class="panel__head">
        <h2>Маркетинг-ассистент</h2>
      </div>
      <div id="recommendations" class="rec-list"></div>
    </aside>
  </section>

  <section class="panel panel--chart">
    <div class="panel__head">
      <h2>Расход и выручка по кампаниям</h2>
    </div>
    <canvas id="spendRevenueChart" height="90"></canvas>
  </section>

</main>

<div id="emptyState" class="empty-state" hidden>
  <h2>Данных ещё нет</h2>
  <p>Нажмите «Обновить данные», чтобы сервис забрал показатели из Facebook и amoCRM.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
